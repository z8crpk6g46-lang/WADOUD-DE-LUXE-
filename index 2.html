<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WADOUD DE LUXE — Mode homme</title>
<meta name="description" content="WADOUD DE LUXE : mode homme, livraison dans toutes les wilayas, paiement à la livraison.">
<style>
:root{--ink:#101a2e;--bg:#eef0f3;--amber:#e08a1e;--mute:#667085;--line:#dfe3ea;--r:14px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;text-align:center;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{font:600 22px/1 Georgia,"Times New Roman",serif;letter-spacing:.14em}
header p{font-size:12px;opacity:.7;margin-top:7px}
.lang{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.lang button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:6px 12px;font:600 13px system-ui;cursor:pointer}
.lang button.on{background:var(--amber)}
.perks{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;max-width:1000px;margin:auto}
.perks span{flex:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
main{max-width:1000px;margin:auto;padding:4px 14px 40px}
h2{font:600 21px Georgia,serif;margin:14px 2px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;cursor:pointer;border:0;text-align:start;font:inherit;color:inherit;box-shadow:0 1px 3px #1020301a}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.card div{padding:10px 12px 13px}
.card b{display:block}.card span{color:var(--mute);font-size:15px}
footer{text-align:center;color:var(--mute);font-size:14px;padding:10px 14px 40px}
footer a{color:var(--ink);font-weight:600}
.sheet{position:fixed;inset:0;background:#000a;display:none;z-index:10}
.sheet.open{display:block}
.panel{background:#fff;max-width:520px;height:100%;margin:auto;overflow-y:auto;position:relative}
.x{position:sticky;top:10px;float:inline-end;margin:10px;margin-bottom:-52px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#fffe;font-size:22px;box-shadow:0 1px 6px #0004}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#e9ebef;scrollbar-width:none;direction:ltr}
.gal img{flex:none;width:100%;aspect-ratio:3/4;object-fit:contain;scroll-snap-align:center}
.cnt{text-align:center;font-size:13px;color:var(--mute);padding:6px}
.body{padding:6px 18px 30px}
.body h3{font:600 24px Georgia,serif}
.price{font-size:22px;font-weight:700;color:var(--amber);margin:2px 0 6px}
.desc{color:var(--mute);margin-bottom:6px}
h4{font:600 18px Georgia,serif;margin:22px 0 2px}
label,.lab{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-width:52px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:600}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.q{display:flex;align-items:center;gap:14px}
.q button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px}
input,select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.box{border:2px solid var(--ink);border-radius:12px;padding:16px;margin-top:22px}
.box h4{margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.box p{display:flex;justify-content:space-between;gap:10px;margin:6px 0}
.ship label{display:flex;gap:10px;align-items:flex-start;margin:6px 0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500;cursor:pointer}
.ship label:has(input:checked){border-color:var(--ink);background:#f3f5f9}
.ship input{width:auto;margin-top:5px}
.ship small{display:block;color:var(--mute)}.ship b{display:block}
.box .tot{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:20px;font-weight:700}
.cod{font-weight:600}.codn{color:var(--mute);font-size:14px}
.go{width:100%;margin-top:16px;padding:16px;border:0;border-radius:999px;background:var(--ink);color:#fff;font:700 17px system-ui;letter-spacing:.06em;cursor:pointer}
.go:disabled{opacity:.6}
.err{color:#c62828;min-height:22px;margin-top:10px;font-weight:600}
.ok{text-align:center;padding:60px 22px}
.ok i{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:#1faa59;color:#fff;font-size:38px;font-style:normal}
.ok h3{margin-bottom:10px}.ok p{color:var(--mute);margin:8px 0}.ok b{color:var(--ink);font-size:20px}
</style>
</head>
<body>
<header>
<div class="lang"><button data-l="ar" onclick="setL('ar')">العربية</button><button data-l="fr" onclick="setL('fr')">Français</button><button data-l="en" onclick="setL('en')">English</button></div>
<h1>WADOUD DE LUXE</h1><p data-k="tag"></p>
</header>
<div class="perks"><span data-k="p1"></span><span data-k="p2"></span><span data-k="p3"></span></div>
<main>
<h2 data-k="coll"></h2>
<div class="grid" id="grid"></div>
</main>
<footer><span data-k="q"></span> <a href="tel:0779926216" data-k="wa"></a><br>© 2026 WADOUD DE LUXE</footer>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeP()">
<div class="panel" id="panel">
<button class="x" onclick="closeP()" aria-label="×">×</button>
<div class="gal" id="gal"></div>
<div class="cnt" id="cnt"></div>
<div class="body">
<h3 id="pname"></h3><div class="price" id="pprice"></div><p class="desc" id="pdesc"></p>

<div id="form">
<div class="lab" data-k="size"></div><div class="chips" id="chips"></div>
<div class="lab" data-k="qty"></div>
<div class="q"><button type="button" onclick="setQ(-1)">−</button><b id="qty">1</b><button type="button" onclick="setQ(1)">+</button></div>

<h4 data-k="info"></h4>
<label for="nom" data-k="nom"></label><input id="nom" autocomplete="name">
<label for="tel" data-k="tel"></label><input id="tel" type="tel" inputmode="tel" placeholder="05 55 12 34 56" autocomplete="tel">
<label for="adr" data-k="adr"></label><input id="adr" autocomplete="street-address">
<label for="wil" data-k="wil"></label><select id="wil" onchange="onWil()"></select>
<label for="com" data-k="com"></label><select id="com"></select><input id="comT" hidden>

<div class="box">
<h4 data-k="cmd"></h4>
<p><span id="li"></span><span id="lip"></span></p>
<p><span data-k="sub"></span><span id="sub"></span></p>
<div class="lab" data-k="liv"></div>
<div class="ship">
<label><input type="radio" name="mode" checked onchange="mode=0;calc()"><span><b data-k="home"></b><small id="t0"></small></span></label>
<label><input type="radio" name="mode" onchange="mode=1;calc()"><span><b data-k="desk"></b><small id="t1"></small></span></label>
</div>
<p class="tot"><span data-k="tot"></span><span id="total"></span></p>
<p class="cod" data-k="cod" style="display:block"></p>
<p class="codn" data-k="codn" style="display:block"></p>
<div class="err" id="err"></div>
<button class="go" id="go" onclick="send()" data-k="go"></button>
</div>
</div>

<div class="ok" id="ok" hidden>
<i>✓</i><h3 data-k="ok1"></h3><p><span data-k="orderno"></span> : <b id="no"></b></p><p data-k="ok2"></p>
<button class="go" onclick="closeP()" data-k="back"></button>
</div>
</div></div></div>

<script>
/* ====== RÉGLAGES ====== */
const ORDER_EMAIL="";   /* ← mettre ici l'e-mail qui reçoit les commandes */
/* TARIFS DE LIVRAISON (DA) par zone : [domicile, bureau] — à remplacer par la grille IMIR Logistics */
const ZONES={A:[400,250],B:[600,400],C:[800,550],D:[1300,900]};
/* PRODUITS : ajoutez un bloc {…} pour chaque nouveau produit */
const PRODUCTS=[
{name:"ENSEMBLE JUL",price:12500,sizes:["S","M","L","XL","XXL"],imgs:["ensemble-jul-1.jpg","ensemble-jul-2.jpg"],desc:{fr:"Veste zippée à capuche et pantalon assortis, bleu marine, finition côtelée et logo brodé.",en:"Zip-up hoodie and matching trousers in navy, ribbed finish with embroidered logo.",ar:"سترة بقلنسوة وسحّاب وسروال متناسق، كحلي بتفصيلة مضلّعة وشعار مطرّز."}}
];
/* WILAYAS (numéro = ordre) : nom:zone */
const W="Adrar:D,Chlef:B,Laghouat:C,Oum El Bouaghi:C,Batna:C,Béjaïa:B,Biskra:C,Béchar:D,Blida:A,Bouira:B,Tamanrasset:D,Tébessa:C,Tlemcen:B,Tiaret:C,Tizi Ouzou:B,Alger:A,Djelfa:C,Jijel:B,Sétif:B,Saïda:C,Skikda:B,Sidi Bel Abbès:B,Annaba:B,Guelma:B,Constantine:B,Médéa:B,Mostaganem:B,M'Sila:C,Mascara:B,Ouargla:D,Oran:B,El Bayadh:C,Illizi:D,Bordj Bou Arréridj:B,Boumerdès:A,El Tarf:B,Tindouf:D,Tissemsilt:B,El Oued:D,Khenchela:C,Souk Ahras:B,Tipaza:A,Mila:B,Aïn Defla:B,Naâma:C,Aïn Témouchent:B,Ghardaïa:D,Relizane:B,Timimoun:D,Bordj Badji Mokhtar:D,Ouled Djellal:C,Béni Abbès:D,In Salah:D,In Guezzam:D,Touggourt:D,Djanet:D,El M'Ghair:D,El Meniaa:D";
const WAR="أدرار,الشلف,الأغواط,أم البواقي,باتنة,بجاية,بسكرة,بشار,البليدة,البويرة,تمنراست,تبسة,تلمسان,تيارت,تيزي وزو,الجزائر,الجلفة,جيجل,سطيف,سعيدة,سكيكدة,سيدي بلعباس,عنابة,قالمة,قسنطينة,المدية,مستغانم,المسيلة,معسكر,ورقلة,وهران,البيض,إليزي,برج بوعريريج,بومرداس,الطارف,تندوف,تيسمسيلت,الوادي,خنشلة,سوق أهراس,تيبازة,ميلة,عين الدفلى,النعامة,عين تموشنت,غرداية,غليزان,تيميمون,برج باجي مختار,أولاد جلال,بني عباس,عين صالح,عين قزام,تقرت,جانت,المغير,المنيعة".split(",");
const DATA="https://cdn.jsdelivr.net/npm/geoalgeria/data/ecommerce/communes.json";

/* ====== TEXTES : fr / en / ar ====== */
const L={
fr:{dir:"ltr",tag:"Mode homme · Élégance · Qualité",p1:"🚚 Livraison dans toutes les wilayas",p2:"💵 Paiement à la livraison",p3:"↻ Échange sous 7 jours",coll:"Collection",q:"Une question ?",wa:"Appelez-nous : 07 79 92 62 16",size:"Taille",qty:"Quantité",info:"Vos informations",nom:"Nom et prénom",tel:"Numéro de téléphone",adr:"Adresse (rue, cité, n°…)",wil:"Wilaya",com:"Commune",cmd:"Votre commande",sub:"Sous-total",liv:"Expédition",home:"Livraison à domicile",desk:"Livraison au bureau (stop desk)",tot:"TOTAL",cod:"Paiement à la livraison",codn:"Payer en argent comptant à la livraison.",go:"COMMANDER",pick:"— Choisir la wilaya —",pickc:"— Choisir d'abord la wilaya —",pickc2:"— Choisir la commune —",selw:"sélectionnez votre wilaya",da:"DA",sw:"glissez pour voir les photos",e1:"Choisissez une taille.",e2:"Entrez votre nom.",e3:"Numéro de téléphone invalide (ex : 0555 12 34 56).",e4:"Choisissez la wilaya.",e5:"Choisissez la commune.",e6:"Entrez votre adresse.",sending:"Envoi en cours…",fail:"Impossible d'envoyer la commande. Réessayez dans un instant.",nocfg:"La prise de commande n'est pas encore activée.",ok1:"Merci ! Commande reçue",ok2:"Nous vous appellerons très bientôt pour confirmer votre commande et la livraison.",orderno:"N° de commande",back:"Continuer mes achats"},
en:{dir:"ltr",tag:"Men's fashion · Elegance · Quality",p1:"🚚 Delivery to all wilayas",p2:"💵 Cash on delivery",p3:"↻ Exchange within 7 days",coll:"Collection",q:"Any question?",wa:"Call us: 07 79 92 62 16",size:"Size",qty:"Quantity",info:"Your details",nom:"Full name",tel:"Phone number",adr:"Address (street, area, no.…)",wil:"Wilaya",com:"Commune",cmd:"Your order",sub:"Subtotal",liv:"Shipping",home:"Home delivery",desk:"Pickup point (stop desk)",tot:"TOTAL",cod:"Cash on delivery",codn:"Pay in cash when your order arrives.",go:"PLACE ORDER",pick:"— Choose your wilaya —",pickc:"— Choose the wilaya first —",pickc2:"— Choose your commune —",selw:"select your wilaya",da:"DA",sw:"swipe to see photos",e1:"Choose a size.",e2:"Enter your name.",e3:"Invalid phone number (e.g. 0555 12 34 56).",e4:"Choose your wilaya.",e5:"Choose your commune.",e6:"Enter your address.",sending:"Sending…",fail:"Could not send your order. Please try again in a moment.",nocfg:"Ordering is not activated yet.",ok1:"Thank you! Order received",ok2:"We will call you very soon to confirm your order and the delivery.",orderno:"Order no.",back:"Keep shopping"},
ar:{dir:"rtl",tag:"أزياء رجالية · أناقة · جودة",p1:"🚚 توصيل إلى جميع الولايات",p2:"💵 الدفع عند الاستلام",p3:"↻ استبدال خلال 7 أيام",coll:"المجموعة",q:"عندك سؤال؟",wa:"اتصل بنا: 07 79 92 62 16",size:"المقاس",qty:"الكمية",info:"معلوماتك",nom:"الاسم واللقب",tel:"رقم الهاتف",adr:"العنوان (الشارع، الحي، الرقم…)",wil:"الولاية",com:"البلدية",cmd:"طلبك",sub:"المجموع الجزئي",liv:"التوصيل",home:"التوصيل إلى المنزل",desk:"التوصيل إلى المكتب (Stop desk)",tot:"المجموع",cod:"الدفع عند الاستلام",codn:"ادفع نقدًا عند استلام طلبك.",go:"اطلب الآن",pick:"— اختر الولاية —",pickc:"— اختر الولاية أولًا —",pickc2:"— اختر البلدية —",selw:"اختر ولايتك",da:"دج",sw:"اسحب لرؤية الصور",e1:"اختر المقاس.",e2:"أدخل اسمك.",e3:"رقم الهاتف غير صحيح (مثال: 0555 12 34 56).",e4:"اختر الولاية.",e5:"اختر البلدية.",e6:"أدخل عنوانك.",sending:"جارٍ الإرسال…",fail:"تعذّر إرسال الطلب. حاول مرة أخرى بعد قليل.",nocfg:"استقبال الطلبات غير مفعّل بعد.",ok1:"شكرًا! تم استلام طلبك",ok2:"سنتصل بك قريبًا لتأكيد طلبك والتوصيل.",orderno:"رقم الطلب",back:"متابعة التسوق"}
};

/* ====== LOGIQUE ====== */
const $=s=>document.querySelector(s);
const BASE=W.split(",").map((x,i)=>{const [n,z]=x.split(":");return {c:i+1,fr:n,ar:WAR[i],z}});
let lg="fr",P,size="",qty=1,mode=0,COM=[],WL=BASE;
const t=k=>L[lg][k],fmt=n=>n.toLocaleString("fr-FR")+" "+t("da"),nm=o=>lg==="ar"?o.ar:o.fr;
const gw=()=>WL.find(x=>x.c==$("#wil").value);

function fillW(){const v=$("#wil").value;
 $("#wil").innerHTML=`<option value="">${t("pick")}</option>`+WL.map(w=>`<option value="${w.c}">${w.c} - ${nm(w)}</option>`).join("");$("#wil").value=v}
function fillC(){const w=gw(),s=$("#com"),i=$("#comT");i.placeholder=t("com");
 if(!COM.length){s.hidden=true;i.hidden=false;return}
 s.hidden=false;i.hidden=true;
 if(!w){s.innerHTML=`<option value="">${t("pickc")}</option>`;return}
 const v=s.value;
 s.innerHTML=`<option value="">${t("pickc2")}</option>`+COM.filter(x=>x.wilaya_code==w.c).sort((a,b)=>a.commune_name_fr.localeCompare(b.commune_name_fr)).map(x=>`<option value="${x.commune_name_fr}">${lg==="ar"?x.commune_name_ar:x.commune_name_fr}</option>`).join("");
 s.value=v}
function setL(l){lg=l;try{localStorage.lg=l}catch(e){}
 document.documentElement.lang=l;document.documentElement.dir=L[l].dir;
 document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t(e.dataset.k));
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
 $("#adr").placeholder=t("adr");
 fillW();fillC();
 $("#grid").innerHTML=PRODUCTS.map((p,i)=>`<button class="card" onclick="openP(${i})"><img src="${p.imgs[0]}" alt="${p.name}" loading="lazy"><div><b>${p.name}</b><span>${fmt(p.price)}</span></div></button>`).join("");
 if(P)calc()}
function onWil(){fillC();calc()}
$("#gal").onscroll=e=>{const g=e.target;$("#cnt").textContent=(Math.round(Math.abs(g.scrollLeft)/g.clientWidth)+1)+" / "+P.imgs.length+" · "+t("sw")};
function openP(i){P=PRODUCTS[i];size="";qty=1;$("#err").textContent="";$("#form").hidden=false;$("#ok").hidden=true;
 $("#pname").textContent=P.name;$("#pprice").textContent=fmt(P.price);$("#pdesc").textContent=P.desc[lg];
 $("#gal").innerHTML=P.imgs.map(s=>`<img src="${s}" alt="${P.name}">`).join("");$("#gal").scrollLeft=0;
 $("#cnt").textContent=P.imgs.length>1?"1 / "+P.imgs.length+" · "+t("sw"):"";
 $("#chips").innerHTML=P.sizes.map(s=>`<button type="button" onclick="pick(this,'${s}')">${s}</button>`).join("");
 $("#qty").textContent=1;calc();$("#sheet").classList.add("open");document.body.style.overflow="hidden";$("#panel").scrollTop=0}
function closeP(){$("#sheet").classList.remove("open");document.body.style.overflow=""}
function pick(el,s){size=s;[...el.parentNode.children].forEach(b=>b.classList.remove("on"));el.classList.add("on");calc()}
function setQ(d){qty=Math.max(1,Math.min(10,qty+d));$("#qty").textContent=qty;calc()}
const rate=w=>ZONES[w.z||"C"];
function calc(){const w=gw(),z=w?rate(w):null,sub=P.price*qty;
 $("#li").textContent=P.name+" × "+qty+(size?" — "+size:"");$("#lip").textContent=fmt(sub);$("#sub").textContent=fmt(sub);
 $("#t0").textContent=z?fmt(z[0]):t("selw");$("#t1").textContent=z?fmt(z[1]):t("selw");
 $("#total").textContent=fmt(sub+(z?z[mode]:0))}
function send(){const v=id=>$("#"+id).value.trim(),w=gw();
 const com=COM.length?v("com"):v("comT");
 const err=!size?t("e1"):!v("nom")?t("e2"):!/^0[567]\d{8}$/.test(v("tel").replace(/\s/g,""))?t("e3"):(mode===0&&!v("adr"))?t("e6"):!w?t("e4"):!com?t("e5"):!ORDER_EMAIL?t("nocfg"):"";
 $("#err").textContent=err;if(err)return;
 const z=rate(w)[mode],no="WDL-"+Date.now().toString(36).slice(-6).toUpperCase();
 const body={_subject:"Nouvelle commande "+no+" — WADOUD DE LUXE",_template:"table",_captcha:"false",
  "N° commande":no,"Produit":P.name,"Taille":size,"Quantité":qty,"Sous-total":P.price*qty+" DA",
  "Livraison":(mode?"Bureau (stop desk)":"À domicile")+" — "+z+" DA","TOTAL À PAYER":(P.price*qty+z)+" DA",
  "Nom":v("nom"),"Téléphone":v("tel"),"Wilaya":w.c+" - "+w.fr,"Commune":com,"Adresse":v("adr")||"(bureau)","Langue du client":lg};
 const b=$("#go");b.disabled=true;$("#err").textContent=t("sending");
 fetch("https://formsubmit.co/ajax/"+ORDER_EMAIL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)})
 .then(r=>r.json()).then(j=>{if(j.success!==true&&j.success!=="true")throw 0;
  $("#no").textContent=no;$("#form").hidden=true;$("#ok").hidden=false;$("#panel").scrollTop=0;$("#err").textContent=""})
 .catch(()=>{$("#err").textContent=t("fail")}).finally(()=>{b.disabled=false})}

/* liste complète des communes (chargée une fois) */
fetch(DATA).then(r=>r.json()).then(d=>{COM=d;const m={};
 d.forEach(x=>{if(!m[x.wilaya_code])m[x.wilaya_code]={c:x.wilaya_code,fr:x.wilaya_name_fr,ar:x.wilaya_name_ar,z:(BASE[x.wilaya_code-1]||{}).z||"C"}});
 WL=Object.values(m).sort((a,b)=>a.c-b.c);fillW();fillC()}).catch(()=>{});
let sv;try{sv=localStorage.lg}catch(e){}
setL(L[sv]?sv:"fr");
</script>
</body>
</html>
