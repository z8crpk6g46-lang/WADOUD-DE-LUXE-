header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,8,11,.9);backdrop-filter:blur(10px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.brand img{width:38px;height:38px;border-radius:50%}
.langs button{background:none;border:1px solid var(--line);color:var(--mut);padding:5px 10px;border-radius:8px;margin-inline-start:4px;font-size:14px}
.langs button.on{color:#1a1405;background:var(--gold);border-color:var(--gold)}
.hero{padding:40px 20px 36px;text-align:center}
.hero img{width:210px;height:210px;border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 18px 60px rgba(217,180,95,.28)}
.hero h1{font-size:30px;margin:22px 0 8px;color:var(--gold2);font-weight:600}
.hero p{color:var(--mut);margin:0 auto 22px;max-width:380px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;border:0;font-weight:700;font-size:16px;padding:14px 28px;border-radius:12px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.6}
main{max-width:520px;margin:0 auto;padding:8px 16px 60px}
h2{font-size:22px;margin:0 0 14px;color:var(--gold2)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;backdrop-filter:blur(6px)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;background:#14151a;display:flex;align-items:center;justify-content:center}
.gal img{width:100%;height:100%;object-fit:cover}
.gal .ph.empty img{width:55%;height:auto;border-radius:50%;opacity:.5}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.info{padding:14px 16px 18px}
.name{font-size:20px;font-weight:700}
.price{color:var(--gold);font-size:22px;font-weight:700;margin:4px 0 12px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sizes button{min-width:50px;padding:10px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--txt);font-size:15px}
.sizes button.on{border-color:var(--gold);background:#2a2412;color:var(--gold2)}
#order{display:none;margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(6px)}
label{display:block;color:var(--mut);font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;background:#0d0e12;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;font-family:inherit}
textarea{min-height:76px}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--txt);font-size:20px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;cursor:pointer;color:var(--txt);font-size:16px}
.opt input{width:auto}
.opt.on{border-color:var(--gold);background:#1d1a10}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.total span:last-child{color:var(--gold2)}
#send{width:100%;margin-top:16px}
#msg{margin-top:12px;text-align:center;font-weight:600}
#thanks{display:none;text-align:center;padding:26px 8px}
#thanks b{display:block;font-size:22px;color:var(--gold2);margin-bottom:8px}
footer{text-align:center;color:var(--mut);padding:24px;border-top:1px solid var(--line);font-size:14px}
footer a{color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>

/* Tarifs IMIR Logistics : [domicile, stop desk] par numéro de wilaya.
   ⚠ Seule la wilaya 7 (Biskra) est confirmée ; les autres sont provisoires. */
const DEFAULT_TARIF = [800, 500];
const TARIF = { 7: [700, 400] };

const W = `1|أدرار|Adrar;2|الشلف|Chlef;3|الأغواط|Laghouat;4|أم البواقي|Oum El Bouaghi;5|باتنة|Batna;6|بجاية|Béjaïa;7|بسكرة|Biskra;8|بشار|Béchar;9|البليدة|Blida;10|البويرة|Bouira;11|تمنراست|Tamanrasset;12|تبسة|Tébessa;13|تلمسان|Tlemcen;14|تيارت|Tiaret;15|تيزي وزو|Tizi Ouzou;16|الجزائر|Alger;17|الجلفة|Djelfa;18|جيجل|Jijel;19|سطيف|Sétif;20|سعيدة|Saïda;21|سكيكدة|Skikda;22|سيدي بلعباس|Sidi Bel Abbès;23|عنابة|Annaba;24|قالمة|Guelma;25|قسنطينة|Constantine;26|المدية|Médéa;27|مستغانم|Mostaganem;28|المسيلة|M'Sila;29|معسكر|Mascara;30|ورقلة|Ouargla;31|وهران|Oran;32|البيض|El Bayadh;33|إليزي|Illizi;34|برج بوعريريج|Bordj Bou Arréridj;35|بومرداس|Boumerdès;36|الطارف|El Tarf;37|تندوف|Tindouf;38|تيسمسيلت|Tissemsilt;39|الوادي|El Oued;40|خنشلة|Khenchela;41|سوق أهراس|Souk Ahras;42|تيبازة|Tipaza;43|ميلة|Mila;44|عين الدفلى|Aïn Defla;45|النعامة|Naâma;46|عين تموشنت|Aïn Témouchent;47|غرداية|Ghardaïa;48|غليزان|Relizane;49|تيميمون|Timimoun;50|برج باجي مختار|Bordj Badji Mokhtar;51|أولاد جلال|Ouled Djellal;52|بني عباس|Béni Abbès;53|عين صالح|In Salah;54|عين قزام|In Guezzam;55|تقرت|Touggourt;56|جانت|Djanet;57|المغير|El M'Ghair;58|المنيعة|El Meniaa`
  .split(";").map(s=>{const [n,ar,fr]=s.split("|");return {n:+n,ar,fr}});

/* ---- Communes : chargées au démarrage (liste officielle, 1541 communes), gardées en cache ---- */
const COM_URL = "https://cdn.jsdelivr.net/gh/othmanus/algeria-cities@master/json/algeria_cities.json";
let BYW = null;                                  // { numéroWilaya: [{ar, fr}] }
function buildIndex(rows){
  const m = {};
  rows.forEach(r=>{
    const code = parseInt(r.wilaya_code,10);
    const ar = r.commune_name || r.name_ar || r.name, fr = r.commune_name_ascii || r.name_fr || ar;
    if(!code || !ar) return;
    (m[code] = m[code] || []).push({ar, fr});
  });
  return Object.keys(m).length > 20 ? m : null;
}
async function loadCommunes(){
  try{ const c = localStorage.getItem("wdl_com"); if(c){ BYW = buildIndex(JSON.parse(c)); } }catch(e){}
  if(BYW){ fillCommunes(); }
  try{
    const r = await fetch(COM_URL); const rows = await r.json();
    const idx = buildIndex(rows);
    if(idx){ BYW = idx; try{localStorage.setItem("wdl_com",JSON.stringify(rows))}catch(e){} }
  }catch(e){}
  fillCommunes();
}

const T = {
 fr:{hero:"Élégance au quotidien",sub:"Vêtements et chaussures. Livraison dans toute l'Algérie, paiement à la livraison.",shop:"Voir les produits",newp:"Nouveau",order:"Commander",form:"Votre commande",fname:"Nom complet",phone:"Téléphone",addr:"Adresse",wil:"Wilaya",com:"Commune",mode:"Mode de livraison",confirm:"Confirmer la commande",home:"🏠 À domicile",desk:"🏢 Stop Desk",size:"Choisis une taille.",fill:"Remplis tous les champs.",okh:"Merci ✅",ok:"Commande reçue. Nous vous appelons bientôt.",pick:"— Choisir la commune —",dir:"ltr"},
 ar:{hero:"أناقة كل يوم",sub:"ملابس وأحذية. توصيل لجميع الولايات والدفع عند الاستلام.",shop:"شاهد المنتجات",newp:"جديد",order:"اطلب الآن",form:"طلبك",fname:"الاسم الكامل",phone:"الهاتف",addr:"العنوان",wil:"الولاية",com:"البلدية",mode:"طريقة التوصيل",confirm:"تأكيد الطلب",home:"🏠 إلى المنزل",desk:"🏢 مكتب التوصيل (Stop Desk)",size:"اختر المقاس.",fill:"املأ جميع الحقول.",okh:"شكرا ✅",ok:"تم استلام طلبك. سنتصل بك قريبا.",pick:"— اختر البلدية —",dir:"rtl"},
 en:{hero:"Everyday elegance",sub:"Clothing and shoes. Delivery across Algeria, pay on delivery.",shop:"View products",newp:"New",order:"Order now",form:"Your order",fname:"Full name",phone:"Phone",addr:"Address",wil:"Wilaya",com:"Commune",mode:"Delivery method",confirm:"Confirm order",home:"🏠 Home delivery",desk:"🏢 Stop Desk",size:"Pick a size.",fill:"Fill in all fields.",okh:"Thank you ✅",ok:"Order received. We will call you soon.",pick:"— Choose commune —",dir:"ltr"}
};
let lang = "fr", size = null, qty = 1;
try{ lang = localStorage.getItem("lang") || "fr"; }catch(e){}
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ") + " DA";
const tarif = () => TARIF[$("wil").value] || DEFAULT_TARIF;
const mode = () => document.querySelector('input[name=m]:checked').value;

function setLang(l){
  lang = l; try{localStorage.setItem("lang",l)}catch(e){}
  document.documentElement.lang = l; document.documentElement.dir = T[l].dir;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent = T[l][e.dataset.t]);
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  const w = $("wil").value; fillWilayas(); if(w) $("wil").value = w;
  fillCommunes(); refresh();
}
function fillWilayas(){
  $("wil").innerHTML = W.map(w=>`<option value="${w.n}">${w.n} — ${lang==="ar"?w.ar:w.fr}</option>`).join("");
  if(!$("wil").value) $("wil").value = 7;
}
function fillCommunes(){
  const list = BYW && BYW[$("wil").value];
  const cur = $("com").value;
  if(!list){ $("com").style.display="none"; $("comtxt").style.display="block"; return; }   // secours si la liste n'a pas chargé
  $("comtxt").style.display="none"; $("com").style.display="block";
  const sorted = list.slice().sort((a,b)=>a.fr.localeCompare(b.fr));
  $("com").innerHTML = `<option value="">${T[lang].pick}</option>` +
    sorted.map(c=>`<option value="${c.fr.replace(/"/g,"&quot;")}">${lang==="ar"?c.ar:c.fr}</option>`).join("");
  if(cur) $("com").value = cur;
}
const getCom = () => $("com").style.display==="none" ? $("comtxt").value.trim() : $("com").value;
function refresh(){
  const [h,d] = tarif();
  $("t1").textContent = `${T[lang].home} — ${h} DA`;
  $("t2").textContent = `${T[lang].desk} — ${d} DA`;
  $("o1").classList.toggle("on", mode()==="home");
  $("o2").classList.toggle("on", mode()==="desk");
  $("q").textContent = qty;
  $("tot").textContent = fmt(PRICE*qty + (mode()==="home"?h:d));
}

/* Galerie photos */
const gal = $("gal");
PHOTOS.forEach(src=>{
  const d = document.createElement("div"); d.className="ph";
  const im = new Image(); im.alt = PRODUCT; im.src = src;
  im.onerror = ()=>{ d.classList.add("empty"); im.src = LOGO; im.onerror = null; };
  d.appendChild(im); gal.appendChild(d);
  const dot = document.createElement("i"); $("dots").appendChild(dot);
});
const dots = [...$("dots").children]; if(dots[0]) dots[0].classList.add("on");
gal.addEventListener("scroll",()=>{const i=Math.round(gal.scrollLeft/gal.clientWidth);dots.forEach((x,k)=>x.classList.toggle("on",Math.abs(k-Math.abs(i))===0))},{passive:true});

SIZES.forEach(s=>{
  const b = document.createElement("button"); b.textContent = s;
  b.onclick = ()=>{size=s;document.querySelectorAll("#sizes button").forEach(x=>x.classList.toggle("on",x===b))};
  $("sizes").appendChild(b);
});
$("buy").onclick = ()=>{
  if(!size){alert(T[lang].size);return}
  $("order").style.display="block"; $("order").scrollIntoView({behavior:"smooth"});
};
$("plus").onclick = ()=>{qty++;refresh()};
$("minus").onclick = ()=>{if(qty>1){qty--;refresh()}};
$("wil").onchange = ()=>{$("com").value="";$("comtxt").value="";fillCommunes();refresh()};
document.querySelectorAll("input[name=m]").forEach(r=>r.onchange=refresh);
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

/* Envoi rapide : confirmation immédiate, envoi en arrière-plan, nouvel essai automatique si besoin */
function post(o){
  return fetch("https://formsubmit.co/ajax/"+EMAIL,{method:"POST",keepalive:true,
    headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(o)})
    .then(r=>{ if(!r.ok) throw 0; });
}
function queue(o){ try{ const q=JSON.parse(localStorage.getItem("wdl_q")||"[]"); q.push(o); localStorage.setItem("wdl_q",JSON.stringify(q)); }catch(e){} }
function flush(){
  let q=[]; try{ q=JSON.parse(localStorage.getItem("wdl_q")||"[]"); }catch(e){}
  if(!q.length) return;
  try{ localStorage.setItem("wdl_q","[]"); }catch(e){}
  q.forEach(o=>post(o).catch(()=>queue(o)));
}
$("send").onclick = ()=>{
  const nom=$("nom").value.trim(), tel=$("tel").value.trim(), adr=$("adr").value.trim(), com=getCom();
  if(!nom||!tel||!adr||!com){$("msg").textContent=T[lang].fill;return}
  const w = W.find(x=>x.n==$("wil").value), [h,d] = tarif(), fee = mode()==="home"?h:d;
  const order = {
    _subject:"Nouvelle commande WADOUD DE LUXE", _template:"table",
    Produit:PRODUCT, Taille:size, Quantite:qty, Nom:nom, Telephone:tel, Adresse:adr,
    Wilaya:w.n+" - "+w.fr, Commune:com,
    Livraison:mode()==="home"?"Domicile":"Stop Desk", Frais_livraison:fee+" DA",
    Total:fmt(PRICE*qty+fee), Paiement:"A la livraison"
  };
  $("formbox").style.display="none"; $("thanks").style.display="block";   // réponse instantanée
  $("order").scrollIntoView({behavior:"smooth"});
  post(order).catch(()=>queue(order));
};
window.addEventListener("online",flush);

fillWilayas(); setLang(lang); loadCommunes(); flush();
</script>
